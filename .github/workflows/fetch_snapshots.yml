name: Fetch Flight Price Snapshots

on:
  schedule:
    # Runs every 12 hours at 00:00 UTC and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-flight-snapshots
  cancel-in-progress: false

jobs:
  fetch-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31,<3" "python-dotenv>=1.0,<2" "pandas>=2.3,<4"

      - name: Run scheduled snapshot collection
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          python -m src.ingestion.scheduler --once

      - name: Commit and push updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/snapshots.csv data/reference data/logs
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore(data): scheduled flight price snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash
          git push
